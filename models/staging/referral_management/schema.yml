version: 2

models:
  - name: staging_referral_management_chatbot
    description: >
      Staging model for patient referrals generated through the referral chatbot.
      SEARCH field staff working in villages — Supervisors, ASHAs, MMU (Mobile Medical Unit)
      team members, and MHD (Mental Health Department) team counsellors — use a chatbot
      to refer a patient to a hospital/OPD team when they assess that the patient needs care
      beyond what can be managed in the village. The chatbot captures the patient and referrer
      details and issues a unique referral code (Reference Number) back to the field staff.
      This model cleans, de-duplicates, and casts the raw Frappe/Airbyte data into one
      validated row per referral.
    columns:
      - name: reference_id
        description: >
          Unique referral code issued by the chatbot when a field staff member raises a
          referral for a patient. Acts as the primary key of this model — one row per
          referral case. Never null or blank; de-duplicated to the most recently
          modified record where the same code appears more than once in the raw sync.
        tests:
          - unique
          - not_null

      - name: referral_date
        description: >
          Date on which the field staff member raised the referral for the patient
          (i.e. the date the patient was assessed in the village and referred onward).
          Stored as a proper date type. Values that don't parse as a valid date in the
          raw data are set to null rather than failing the model.
        tests:
          - not_null

      - name: phc
        description: >
          Name of the PHC (Primary Health Centre) / village catchment area the field
          staff member is operating in when the referral was raised. Free text, trimmed.

      - name: referrer_department
        description: >
          Team/department of the SEARCH field staff member who raised the referral —
          e.g. MMU (Mobile Medical Unit), MHD (Mental Health Department), or similar
          field cadres. Free text, trimmed.

      - name: referrer_name
        description: >
          Name of the SEARCH field staff member (Supervisor, ASHA, MMU team member, or
          MHD counsellor) who identified the patient's need and raised the referral via
          the chatbot. Free text, trimmed.

      - name: patient_name
        description: >
          Name of the patient being referred to the hospital/OPD team for care, as
          recorded by the field staff member in the chatbot. Free text, trimmed.

      - name: patient_age
        description: >
          Age of the patient in years, as recorded by the field staff member. Constrained
          to a realistic human range (0–120); any value outside this range or non-numeric
          entry is set to null rather than passed through uncorrected.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 120

      - name: patient_gender
        description: >
          Gender of the patient as recorded by the field staff member, normalised to
          exactly one of "Male", "Female", or "Other". Any unrecognised or blank value
          is set to null.
        tests:
          - accepted_values:
              values: ['Male', 'Female', 'Other']

      - name: referred_to_department
        description: >
          The hospital OPD department the patient was referred to for treatment
          (sourced from the chatbot's "Opd Departments" field) — e.g. Orthopedics,
          Gynaecology, etc. Free text, trimmed.
      - name: patient_taluka
        description: >
          The taluka (sub-district) of the patient being referred, as recorded by the
          field staff member in the chatbot. Free text, trimmed.